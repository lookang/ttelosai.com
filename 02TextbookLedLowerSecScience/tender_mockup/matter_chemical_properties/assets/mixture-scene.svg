<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Air is a mixture</title><desc id="desc">Blue nitrogen particles, red oxygen particles and a small amount of other gas particles share one container.</desc><rect width="760" height="360" rx="28" fill="#eaf6fb"/><rect x="95" y="48" width="570" height="260" rx="34" fill="#fff" stroke="#164e75" stroke-width="8"/><text x="380" y="91" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#082f57">AIR: A MIXTURE OF GASES</text><g stroke="#fff" stroke-width="3"><circle cx="190" cy="170" r="25" fill="#308bc8"/><circle cx="290" cy="225" r="25" fill="#308bc8"/><circle cx="430" cy="152" r="25" fill="#308bc8"/><circle cx="548" cy="225" r="25" fill="#308bc8"/><circle cx="230" cy="255" r="25" fill="#308bc8"/><circle cx="510" cy="145" r="25" fill="#308bc8"/><circle cx="350" cy="195" r="25" fill="#f05b55"/><circle cx="590" cy="175" r="25" fill="#f05b55"/><circle cx="455" cy="255" r="18" fill="#f0bd39"/></g><text x="165" y="335" font-family="Arial" font-size="18" fill="#164e75">nitrogen</text><circle cx="145" cy="329" r="10" fill="#308bc8"/><text x="360" y="335" font-family="Arial" font-size="18" fill="#164e75">oxygen</text><circle cx="340" cy="329" r="10" fill="#f05b55"/><text x="535" y="335" font-family="Arial" font-size="18" fill="#164e75">other gases</text><circle cx="515" cy="329" r="10" fill="#f0bd39"/></svg>
